apply plugin: 'com.android.application'

android {
    namespace "com.suhaobo.edgeshot"
    compileSdk 35

    defaultConfig {
        applicationId "com.suhaobo.edgeshot"
        minSdkVersion 23
        targetSdkVersion 35
        // 1.0.0 起就是「边缘截图」自己的版本线
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // FileProvider（截图经 FileProvider 分享 / 复制到剪贴板）与注解，不引 appcompat
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.annotation:annotation:1.8.0"
}
